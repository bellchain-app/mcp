# Checks the server on each push to main and each pull request: types, tests, build, and that the built server starts
# without a key and lists its tools, from Node.js and from the Docker image. Actions are pinned to commits; the version
# is in the comment behind them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, build and start
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Server starts and lists its tools
        run: npm run smoke
      - name: Docker image starts and lists its tools
        run: |
          docker build --tag bellchain-mcp .
          npm run smoke -- docker run --rm -i bellchain-mcp
